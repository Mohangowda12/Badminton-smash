<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142d3b"><title>Smash Club</title>
<style>
:root{--navy:#142d3b;--bg:#f3f6f7;--ink:#17252d;--muted:#687780;--line:#e1e8eb;--green:#087b52;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.app{max-width:650px;margin:auto;padding:14px 14px 40px}.hero{background:var(--navy);color:white;border-radius:20px;padding:20px;margin-bottom:14px}.sub{color:#c5d8dd;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stats strong{display:block;font-size:24px}.stats span{font-size:12px;color:#c5d8dd}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}button{border:0;border-radius:11px;padding:11px 13px;background:#e9eff1;color:var(--ink);font:inherit;font-weight:650}.nav .active,.primary{background:var(--navy);color:white}.panel,.card{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}h2{font-size:18px;margin:4px 0 12px}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d6e0e4;border-radius:10px;background:white;color:var(--ink);font:inherit}.row,.between{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.row>*{flex:1}.full{width:100%;margin-top:10px}.muted,.note{color:var(--muted);font-size:12px;line-height:1.5}.hidden{display:none!important}.player{padding:9px 0;border-bottom:1px solid var(--line)}.badge{font-size:11px;background:#edf3f4;padding:4px 8px;border-radius:20px}.good{color:var(--green);font-weight:750}.bad{color:var(--red);font-weight:750}.empty{background:#f7f9fa;border-radius:12px;padding:20px;text-align:center;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:650;background:#f7f9fa}.tablewrap{overflow-x:auto}.zero{font-weight:800;color:var(--green)}
</style></head><body><main class="app">
<header class="hero"><b>🏸 SMASH CLUB</b><div class="sub">TOURNAMENTS • JOKER ROTATION • PLAYER POINTS</div><div class="stats"><div><strong id="pc">0</strong><span>Players</span></div><div><strong id="tc">0</strong><span>Tournaments</span></div><div><strong id="active">—</strong><span>Current</span></div></div></header>
<nav class="nav"><button class="active" data-tab="tournament">Tournament</button><button data-tab="players">Players</button><button data-tab="history">History</button></nav>
<section id="tournament"><div class="panel"><h2>Start tournament</h2><label>Tournament name</label><input id="name" placeholder="e.g. Friday Smash"><label>Choose participants</label><div id="pick"></div><div class="muted" id="pickCount">0 selected</div><button id="start" class="primary full" disabled>Start tournament</button></div><div id="active"></div></section>
<section id="players" class="hidden"><div class="panel"><h2>Players</h2><div class="row"><input id="newPlayer" placeholder="Player name"><button id="add" class="primary">Add</button></div></div><div id="plist" class="card"></div></section>
<section id="history" class="hidden"><h2>Tournament history</h2><div id="hist"></div><h2>Overall leaderboard</h2><div id="leader"></div></section>
<p class="note">Records are saved in this browser on this device. Export backups regularly.</p><div class="row"><button id="export">Export backup</button><button id="import">Import backup</button><input id="file" type="file" accept="application/json" class="hidden"></div>
</main><script>
const KEY='smashClubZeroSumV3';let db={players:[],events:[],current:null};try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}let selected=new Set();const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>(n>0?'+':'')+Number(n).toFixed(Number(n)%1?1:0);
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function tab(x){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===x));['tournament','players','history'].forEach(y=>$(y).classList.toggle('hidden',x!==y))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function render(){ $('pc').textContent=db.players.length;$('tc').textContent=db.events.length;$('active').textContent=db.current?'Active':'—';
$('pick').innerHTML=db.players.map(p=>`<label><input type="checkbox" data-pick="${esc(p)}" ${selected.has(p)?'checked':''} style="width:auto;margin-right:8px">${esc(p)}</label>`).join('')||'<p class="muted">Add players first.</p>';$('pickCount').textContent=selected.size+' selected';$('start').disabled=selected.size<4||!!db.current;
$('plist').innerHTML=db.players.map(p=>`<div class="player">${esc(p)}</div>`).join('')||'<div class="empty">No players yet.</div>';
$('active').innerHTML=db.current?activeHTML(db.current):'';
$('hist').innerHTML=db.events.length?[...db.events].reverse().map(t=>`<div class="card"><div class="between"><b>${esc(t.name)}</b><span class="badge">${t.mode} · ${t.players.length} players</span></div><div class="muted">${esc(t.date)} · Completed${t.jokerName?' · Joker: '+esc(t.jokerName):''}</div><button class="full" data-detail="${t.id}">View match & points table</button></div>`).join(''):'<div class="empty">No completed tournaments.</div>';
let totals={};db.players.forEach(p=>totals[p]=0);db.events.forEach(t=>Object.entries(t.points).forEach(([p,v])=>totals[p]=(totals[p]||0)+v));$('leader').innerHTML=Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div class="between player"><b>${esc(p)}</b><b class="${v>0?'good':v<0?'bad':''}">${fmt(v)}</b></div>`).join('')||'<div class="empty">No results yet.</div>';
}
function activeHTML(t){let odd=t.players.length%2;let h=`<div class="panel"><div class="between"><h2>${esc(t.name)}</h2><span class="badge">${odd?'Joker':'Even'} · ${t.players.length}</span></div><p class="muted">Players: ${t.players.map(esc).join(', ')}</p>`;
if(!odd){h+=`<h3>Winning doubles</h3>${sel('winner1','Winner 1',t.players)}${sel('winner2','Winner 2',t.players)}<h3>Losing doubles</h3>${sel('loser1','Loser 1',t.players)}${sel('loser2','Loser 2',t.players)}<p class="note">Each winner receives ${(t.players.length-2)*25/2} points; each losing player receives the same amount as a negative score. Other participants receive 0. Match total = 0.</p><button class="primary full" id="finishEven">Complete tournament</button>`}
else{h+=`<label>Joker</label><select id="joker">${opts(t.players)}</select><h3>Initial winning doubles (non-Joker players)</h3>${sel('first1','Winner 1',t.players)}${sel('first2','Winner 2',t.players)}<h3>Joker challenge</h3><label>Joker's partner (choose a different non-Joker)</label><select id="partner">${opts(t.players)}</select><label>Challenge winner</label><select id="challenge"><option value="">Select winner</option><option value="joker">Joker + partner</option><option value="first">Initial winning pair</option></select><p class="note">Initial match: +25 each winner, −25 each loser. Challenge: if Joker team wins, Joker +50, partner +25, opponents −37.5 each. If initial pair wins, each gets +25, Joker partner −25 for this loss (plus their initial loss where applicable), Joker 0. All match rows balance to zero.</p><button class="primary full" id="finishOdd">Complete tournament</button>`}
h+=`<button class="full" id="cancel">Cancel tournament</button></div>`;return h}
function opts(a){return '<option value="">Select player</option>'+a.map(p=>`<option>${esc(p)}</option>`).join('')}function sel(id,label,a){return `<label>${label}</label><select id="${id}">${opts(a)}</select>`}
function table(t){let rows=t.rows,cols=['Player',...rows.map((r,i)=>'Match '+(i+1)),'Final total'];let body=t.players.map(p=>{let vals=rows.map(r=>r.points[p]||0),sum=vals.reduce((a,b)=>a+b,0);return `<tr><td>${esc(p)}</td>${vals.map(v=>`<td class="${v>0?'good':v<0?'bad':''}">${fmt(v)}</td>`).join('')}<td><b>${fmt(sum)}</b></td></tr>`}).join('');let totals=rows.map(r=>Object.values(r.points).reduce((a,b)=>a+b,0));let grand=t.players.reduce((s,p)=>s+(t.points[p]||0),0);return `<div class="card"><h3>${esc(t.name)} — Match ledger</h3><div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${body}<tr><th>Match total</th>${totals.map(v=>`<th class="${v===0?'zero':'bad'}">${fmt(v)}</th>`).join('')}<th class="${grand===0?'zero':'bad'}">${fmt(grand)}</th></tr></tbody></table></div><p class="note">Every match and the final tournament total should equal 0.</p><h3>Matches played</h3>${rows.map((r,i)=>`<div class="player"><b>Match ${i+1}:</b> ${esc(r.label)}<br><span class="muted">${esc(r.winner)}</span></div>`).join('')}</div>`}
function complete(t,rows){t.rows=rows;t.points={};t.players.forEach(p=>t.points[p]=rows.reduce((s,r)=>s+(r.points[p]||0),0));t.status='Completed';t.total=Object.values(t.points).reduce((a,b)=>a+b,0);db.events.push(t);db.current=null;save();tab('history');alert('Tournament saved. Final total: '+fmt(t.total))}
$('pick').onchange=e=>{if(e.target.dataset.pick){let p=e.target.dataset.pick;e.target.checked?selected.add(p):selected.delete(p);$('pickCount').textContent=selected.size+' selected';$('start').disabled=selected.size<4||!!db.current}};
$('add').onclick=()=>{let p=$('newPlayer').value.trim();if(!p)return;if(db.players.some(x=>x.toLowerCase()===p.toLowerCase()))return alert('Player already exists');db.players.push(p);$('newPlayer').value='';save()};$('newPlayer').onkeydown=e=>{if(e.key==='Enter')$('add').click()};
$('start').onclick=()=>{let ps=[...selected];db.current={id:Date.now(),name:$('name').value.trim()||'Tournament '+(db.events.length+1),players:ps,mode:ps.length%2?'Joker':'Even',date:new Date().toLocaleDateString()};selected.clear();save()};
$('active').onclick=e=>{let t=db.current;if(e.target.id==='cancel'){if(confirm('Cancel this tournament?')){db.current=null;save()}return}
if(e.target.id==='finishEven'){let a=$('winner1').value,b=$('winner2').value,c=$('loser1').value,d=$('loser2').value;if(!a||!b||!c||!d||new Set([a,b,c,d]).size!==4)return alert('Select four different players: two winners and two losers');let val=(t.players.length-2)*25/2,pts={};t.players.forEach(p=>pts[p]=0);pts[a]=val;pts[b]=val;pts[c]=-val;pts[d]=-val;let rows=[{label:a+' + '+b+' vs '+c+' + '+d,winner:a+' + '+b,points:pts}];complete(t,rows)}
if(e.target.id==='finishOdd'){let j=$('joker').value,a=$('first1').value,b=$('first2').value,p=$('partner').value,c=$('challenge').value;if(!j||!a||!b||!p||!c||new Set([j,a,b,p]).size!==4)return alert('Select distinct Joker, first winners and partner, plus challenge winner');let others=t.players.filter(x=>x!==j),initialLosers=others.filter(x=>x!==a&&x!==b);if(initialLosers.length!==2)return alert('Initial match requires exactly four non-Joker players. For 7+ participants, the additional player format needs a defined match schedule.');let r1={};t.players.forEach(x=>r1[x]=0);r1[a]=25;r1[b]=25;initialLosers.forEach(x=>r1[x]=-25);let r2={};t.players.forEach(x=>r2[x]=0);let label2='Joker '+j+' + '+p+' vs '+a+' + '+b;if(c==='joker'){r2[j]=50;r2[p]=25;r2[a]=-37.5;r2[b]=-37.5}else{r2[a]=25;r2[b]=25;r2[j]=0;r2[p]=-50}t.jokerName=j;let rows=[{label:a+' + '+b+' vs '+initialLosers.join(' + '),winner:a+' + '+b,points:r1},{label:j+' (Joker) + '+p+' vs '+a+' + '+b,winner:c==='joker'?j+' + '+p:a+' + '+b,points:r2}];complete(t,rows)}
};
$('hist').onclick=e=>{let id=e.target.dataset.detail;if(!id)return;let t=db.events.find(x=>String(x.id)===id);let w=window.open('','_blank');if(w){w.document.write('<meta name="viewport" content="width=device-width"><title>'+esc(t.name)+'</title><body style="font:15px system-ui;padding:15px;background:#f3f6f7">'+table(t)+'</body>');w.document.close()}};
$('export').onclick=()=>{let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='smash-club-backup.json';a.click();URL.revokeObjectURL(u)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.players)||!Array.isArray(d.events))throw 0;if(confirm('Replace current data with backup?')){db=d;save()}}catch(x){alert('Invalid backup')}e.target.value=''};
render();
</script></body></html>
